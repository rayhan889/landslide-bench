spark.master                         spark://spark-master:7077
spark.driver.host                    spark-master
spark.driver.bindAddress             0.0.0.0
spark.driver.memory                  1g
spark.executor.cores                 3
spark.executor.memory                2g
spark.executor.memoryOverhead        768m

spark.sql.session.timeZone           UTC
spark.sql.parquet.compression.codec  zstd
spark.sql.execution.arrow.pyspark.enabled  true

spark.eventLog.enabled               true
spark.eventLog.dir                   file:///workspace/results/spark-events

spark.sql.extensions                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.bench              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bench.type         hadoop
spark.sql.catalog.bench.warehouse    hdfs://namenode:8020/landslide/warehouse
spark.sql.parquet.outputTimestampType  TIMESTAMP_MICROS
